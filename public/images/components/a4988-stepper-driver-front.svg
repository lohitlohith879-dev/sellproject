<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(15, 23, 42, 0.22)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lcdBacklight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="heatsinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbUno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878f"/>
      <stop offset="100%" stop-color="#00666d"/>
    </linearGradient>
    <linearGradient id="pcbEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbRpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="pcbSensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pcbRelay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  
  </defs>

  <!-- Clean Studio Backdrop (Pure White for Real Product Photography Aesthetic) -->
  <rect width="640" height="500" fill="#ffffff"/>

  <!-- Realistic Cast Soft Ground Shadow -->
  <ellipse cx="320" cy="445" rx="250" ry="26" fill="rgba(15, 23, 42, 0.09)"/>

  <!-- Main Physical Hardware Component -->
  <g  filter="url(#shadow)">
    <!-- Main PCB Base Board -->
    <rect x="80" y="75" width="480" height="340" rx="20" fill="url(#pcbRelay)" stroke="#7f1d1d" stroke-width="3"/>
    
    <!-- 4 Corner Mounting Holes with Copper Pads -->
    <circle cx="108" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="103" r="6" fill="#cbd5e1"/>
    
    <circle cx="532" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="103" r="6" fill="#cbd5e1"/>

    <circle cx="108" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="387" r="6" fill="#cbd5e1"/>

    <circle cx="532" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="387" r="6" fill="#cbd5e1"/>

    <!-- Inner Board Hardware Layout -->
    
      <!-- Royal Blue SONGLE Cubic Relay -->
      <rect x="200" y="140" width="180" height="160" rx="6" fill="url(#relayGrad)" stroke="#1e3a8a" stroke-width="2.5" filter="url(#shadow)"/>
      <text x="290" y="175" fill="#ffffff" font-family="'JetBrains Mono', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SONGLE</text>
      <text x="290" y="200" fill="#93c5fd" font-family="monospace" font-size="11" text-anchor="middle">SRD-05VDC-SL-C</text>
      <text x="290" y="222" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">10A 250VAC • 10A 30VDC</text>
      <path d="M 230 250 L 260 250 L 270 235 L 285 265 L 300 235 L 315 265 L 325 250 L 350 250" stroke="#facc15" stroke-width="2" fill="none"/>

      <!-- Green High-Voltage 3-Pin Screw Terminal Block (NO, COM, NC) -->
      <rect x="420" y="145" width="70" height="150" rx="6" fill="#15803d" stroke="#166534" stroke-width="2"/>
      
        <circle cx="455" cy="175" r="14" fill="#0f172a" stroke="url(#metalGrad)" stroke-width="2"/>
        <line x1="446" y1="175" x2="464" y2="175" stroke="url(#metalGrad)" stroke-width="3"/>
      
        <circle cx="455" cy="220" r="14" fill="#0f172a" stroke="url(#metalGrad)" stroke-width="2"/>
        <line x1="446" y1="220" x2="464" y2="220" stroke="url(#metalGrad)" stroke-width="3"/>
      
        <circle cx="455" cy="265" r="14" fill="#0f172a" stroke="url(#metalGrad)" stroke-width="2"/>
        <line x1="446" y1="265" x2="464" y2="265" stroke="url(#metalGrad)" stroke-width="3"/>
      
      <text x="505" y="180" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">NO</text>
      <text x="505" y="225" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">COM</text>
      <text x="505" y="270" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">NC</text>

      <!-- Low-Voltage Control Header (VCC, GND, IN) -->
      <g fill="#1e293b" stroke="#000000" stroke-width="1">
        
          <rect x="115" y="170" width="20" height="20" rx="3"/>
          <circle cx="125" cy="180" r="4" fill="url(#goldGrad)"/>
          <text x="105" y="184" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="end">VCC</text>
        
          <rect x="115" y="205" width="20" height="20" rx="3"/>
          <circle cx="125" cy="215" r="4" fill="url(#goldGrad)"/>
          <text x="105" y="219" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="end">GND</text>
        
          <rect x="115" y="240" width="20" height="20" rx="3"/>
          <circle cx="125" cy="250" r="4" fill="url(#goldGrad)"/>
          <text x="105" y="254" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="end">IN</text>
        
      </g>

      <!-- Status Indicator LEDs & Optocoupler -->
      <circle cx="155" cy="275" r="5" fill="#10b981"/>
      <circle cx="155" cy="295" r="5" fill="#ef4444"/>
      <rect x="150" y="200" width="30" height="22" rx="3" fill="#0f172a" stroke="#475569"/>
      <text x="165" y="215" fill="#cbd5e1" font-family="monospace" font-size="8" text-anchor="middle">PC817</text>

      <text x="290" y="340" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">5V 1-CHANNEL OPTO RELAY</text>
    

    <!-- Brand Silkscreen -->
    <text x="540" y="340" fill="rgba(255,255,255,0.75)" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="end">A4988 Pololu Compatible Module</text>
    <text x="540" y="358" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="end">CIRCUITKART GENUINE</text>
  </g>

  <!-- View Angle Tag in Bottom Right -->
  <rect x="420" y="450" width="200" height="34" rx="8" fill="#0f172a" stroke="rgba(0,0,0,0.12)"/>
  <text x="520" y="472" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">HERO FRONT VIEW</text>
</svg>