<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(15, 23, 42, 0.22)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lcdBacklight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="heatsinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbUno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878f"/>
      <stop offset="100%" stop-color="#00666d"/>
    </linearGradient>
    <linearGradient id="pcbEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbRpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="pcbSensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pcbRelay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  
  </defs>

  <!-- Clean Studio Backdrop (Pure White for Real Product Photography Aesthetic) -->
  <rect width="640" height="500" fill="#ffffff"/>

  <!-- Realistic Cast Soft Ground Shadow -->
  <ellipse cx="320" cy="445" rx="250" ry="26" fill="rgba(15, 23, 42, 0.09)"/>

  <!-- Main Physical Hardware Component -->
  <g transform="rotate(-5 320 260) skewX(-4) scale(0.95)" filter="url(#shadow)">
    <!-- Main PCB Base Board -->
    <rect x="80" y="75" width="480" height="340" rx="20" fill="url(#pcbUno)" stroke="#00666d" stroke-width="3"/>
    
    <!-- 4 Corner Mounting Holes with Copper Pads -->
    <circle cx="108" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="103" r="6" fill="#cbd5e1"/>
    
    <circle cx="532" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="103" r="6" fill="#cbd5e1"/>

    <circle cx="108" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="387" r="6" fill="#cbd5e1"/>

    <circle cx="532" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="387" r="6" fill="#cbd5e1"/>

    <!-- Inner Board Hardware Layout -->
    
      <!-- USB Type-B Port on Top Left -->
      <rect x="80" y="115" width="65" height="60" rx="6" fill="url(#metalGrad)" stroke="#475569" stroke-width="2.5"/>
      <rect x="95" y="130" width="35" height="30" rx="3" fill="#1e293b"/>

      <!-- DC Power Barrel Jack on Bottom Left -->
      <rect x="75" y="275" width="70" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <circle cx="110" cy="307" r="14" fill="#0f172a" stroke="url(#metalGrad)" stroke-width="2"/>
      <circle cx="110" cy="307" r="5" fill="url(#metalGrad)"/>

      <!-- ATmega328P DIP-28 IC Chip in Center -->
      <rect x="210" y="200" width="220" height="85" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
      <circle cx="225" cy="242" r="5" fill="#475569"/>
      <text x="320" y="235" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">ATmega328P-PU</text>
      <text x="320" y="258" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">MICROCHIP AVR 16MHz</text>

      <!-- DIP Silver IC Pins -->
      <g fill="url(#metalGrad)" stroke="#475569" stroke-width="0.8">
        
          <rect x="220" y="190" width="8" height="10" rx="1"/>
          <rect x="220" y="285" width="8" height="10" rx="1"/>
        
          <rect x="235" y="190" width="8" height="10" rx="1"/>
          <rect x="235" y="285" width="8" height="10" rx="1"/>
        
          <rect x="250" y="190" width="8" height="10" rx="1"/>
          <rect x="250" y="285" width="8" height="10" rx="1"/>
        
          <rect x="265" y="190" width="8" height="10" rx="1"/>
          <rect x="265" y="285" width="8" height="10" rx="1"/>
        
          <rect x="280" y="190" width="8" height="10" rx="1"/>
          <rect x="280" y="285" width="8" height="10" rx="1"/>
        
          <rect x="295" y="190" width="8" height="10" rx="1"/>
          <rect x="295" y="285" width="8" height="10" rx="1"/>
        
          <rect x="310" y="190" width="8" height="10" rx="1"/>
          <rect x="310" y="285" width="8" height="10" rx="1"/>
        
          <rect x="325" y="190" width="8" height="10" rx="1"/>
          <rect x="325" y="285" width="8" height="10" rx="1"/>
        
          <rect x="340" y="190" width="8" height="10" rx="1"/>
          <rect x="340" y="285" width="8" height="10" rx="1"/>
        
          <rect x="355" y="190" width="8" height="10" rx="1"/>
          <rect x="355" y="285" width="8" height="10" rx="1"/>
        
          <rect x="370" y="190" width="8" height="10" rx="1"/>
          <rect x="370" y="285" width="8" height="10" rx="1"/>
        
          <rect x="385" y="190" width="8" height="10" rx="1"/>
          <rect x="385" y="285" width="8" height="10" rx="1"/>
        
          <rect x="400" y="190" width="8" height="10" rx="1"/>
          <rect x="400" y="285" width="8" height="10" rx="1"/>
        
          <rect x="415" y="190" width="8" height="10" rx="1"/>
          <rect x="415" y="285" width="8" height="10" rx="1"/>
        
      </g>

      <!-- 16MHz Quartz Crystal Oscillator -->
      <rect x="210" y="145" width="45" height="24" rx="12" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5"/>
      <text x="232" y="161" fill="#1e293b" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">16.000</text>

      <!-- Reset Push-Button -->
      <rect x="160" y="115" width="26" height="26" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
      <circle cx="173" cy="128" r="7" fill="#ef4444"/>
      <text x="173" y="152" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">RESET</text>

      <!-- ICSP 6-Pin Male Header -->
      <g fill="#1e293b" stroke="#0f172a">
        <rect x="445" y="225" width="30" height="42" rx="3"/>
        <circle cx="453" cy="235" r="3" fill="url(#goldGrad)"/>
        <circle cx="467" cy="235" r="3" fill="url(#goldGrad)"/>
        <circle cx="453" cy="246" r="3" fill="url(#goldGrad)"/>
        <circle cx="467" cy="246" r="3" fill="url(#goldGrad)"/>
        <circle cx="453" cy="257" r="3" fill="url(#goldGrad)"/>
        <circle cx="467" cy="257" r="3" fill="url(#goldGrad)"/>
      </g>
      <text x="460" y="280" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8" text-anchor="middle">ICSP</text>

      <!-- Top Header Strip (Digital I/O) -->
      <g fill="#1e293b" stroke="#000000" stroke-width="1">
        
          <rect x="165" y="95" width="15" height="15" rx="2"/>
          <circle cx="172" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="184" y="95" width="15" height="15" rx="2"/>
          <circle cx="191" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="203" y="95" width="15" height="15" rx="2"/>
          <circle cx="210" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="222" y="95" width="15" height="15" rx="2"/>
          <circle cx="229" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="241" y="95" width="15" height="15" rx="2"/>
          <circle cx="248" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="260" y="95" width="15" height="15" rx="2"/>
          <circle cx="267" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="279" y="95" width="15" height="15" rx="2"/>
          <circle cx="286" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="298" y="95" width="15" height="15" rx="2"/>
          <circle cx="305" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="317" y="95" width="15" height="15" rx="2"/>
          <circle cx="324" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="336" y="95" width="15" height="15" rx="2"/>
          <circle cx="343" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="355" y="95" width="15" height="15" rx="2"/>
          <circle cx="362" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="374" y="95" width="15" height="15" rx="2"/>
          <circle cx="381" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="393" y="95" width="15" height="15" rx="2"/>
          <circle cx="400" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="412" y="95" width="15" height="15" rx="2"/>
          <circle cx="419" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="431" y="95" width="15" height="15" rx="2"/>
          <circle cx="438" cy="102" r="3" fill="url(#goldGrad)"/>
        
          <rect x="450" y="95" width="15" height="15" rx="2"/>
          <circle cx="457" cy="102" r="3" fill="url(#goldGrad)"/>
        
      </g>
      <text x="310" y="90" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">DIGITAL (PWM ~)</text>

      <!-- Bottom Header Strip (Power & Analog) -->
      <g fill="#1e293b" stroke="#000000" stroke-width="1">
        
          <rect x="180" y="365" width="15" height="15" rx="2"/>
          <circle cx="187" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="200" y="365" width="15" height="15" rx="2"/>
          <circle cx="207" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="220" y="365" width="15" height="15" rx="2"/>
          <circle cx="227" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="240" y="365" width="15" height="15" rx="2"/>
          <circle cx="247" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="260" y="365" width="15" height="15" rx="2"/>
          <circle cx="267" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="280" y="365" width="15" height="15" rx="2"/>
          <circle cx="287" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="300" y="365" width="15" height="15" rx="2"/>
          <circle cx="307" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="320" y="365" width="15" height="15" rx="2"/>
          <circle cx="327" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="340" y="365" width="15" height="15" rx="2"/>
          <circle cx="347" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="360" y="365" width="15" height="15" rx="2"/>
          <circle cx="367" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="380" y="365" width="15" height="15" rx="2"/>
          <circle cx="387" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="400" y="365" width="15" height="15" rx="2"/>
          <circle cx="407" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="420" y="365" width="15" height="15" rx="2"/>
          <circle cx="427" cy="372" r="3" fill="url(#goldGrad)"/>
        
          <rect x="440" y="365" width="15" height="15" rx="2"/>
          <circle cx="447" cy="372" r="3" fill="url(#goldGrad)"/>
        
      </g>
      <text x="230" y="396" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="9" font-weight="bold">POWER</text>
      <text x="380" y="396" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="9" font-weight="bold">ANALOG IN</text>

      <!-- Status Indicator LEDs (ON, L, TX, RX) -->
      <circle cx="280" cy="140" r="4" fill="#10b981"/>
      <text x="290" y="143" fill="#ffffff" font-family="monospace" font-size="8">ON</text>
      <circle cx="280" cy="155" r="4" fill="#f59e0b"/>
      <text x="290" y="158" fill="#ffffff" font-family="monospace" font-size="8">L</text>
      <circle cx="330" cy="140" r="4" fill="#38bdf8"/>
      <text x="340" y="143" fill="#ffffff" font-family="monospace" font-size="8">TX</text>
      <circle cx="330" cy="155" r="4" fill="#38bdf8"/>
      <text x="340" y="158" fill="#ffffff" font-family="monospace" font-size="8">RX</text>

      <!-- Arduino Infinity Map Silkscreen -->
      <path d="M 440 145 C 430 135, 410 135, 410 145 C 410 155, 430 155, 440 145 C 450 135, 470 135, 470 145 C 470 155, 450 155, 440 145 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <text x="440" y="172" fill="#ffffff" font-family="'JetBrains Mono', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">UNO</text>
    

    <!-- Brand Silkscreen -->
    <text x="540" y="340" fill="rgba(255,255,255,0.75)" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="end">ABX00023</text>
    <text x="540" y="358" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="end">CIRCUITKART GENUINE</text>
  </g>

  <!-- View Angle Tag in Bottom Right -->
  <rect x="420" y="450" width="200" height="34" rx="8" fill="#0f172a" stroke="rgba(0,0,0,0.12)"/>
  <text x="520" y="472" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">3D PERSPECTIVE VIEW</text>
</svg>