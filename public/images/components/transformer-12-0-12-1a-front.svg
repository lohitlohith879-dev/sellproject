<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(15, 23, 42, 0.22)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lcdBacklight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="heatsinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbUno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878f"/>
      <stop offset="100%" stop-color="#00666d"/>
    </linearGradient>
    <linearGradient id="pcbEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbRpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="pcbSensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pcbRelay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  
  </defs>

  <!-- Clean Studio Backdrop (Pure White for Real Product Photography Aesthetic) -->
  <rect width="640" height="500" fill="#ffffff"/>

  <!-- Realistic Cast Soft Ground Shadow -->
  <ellipse cx="320" cy="445" rx="250" ry="26" fill="rgba(15, 23, 42, 0.09)"/>

  <!-- Main Physical Hardware Component -->
  <g  filter="url(#shadow)">
    <!-- Main PCB Base Board -->
    <rect x="80" y="75" width="480" height="340" rx="20" fill="url(#pcbUno)" stroke="#00666d" stroke-width="3"/>
    
    <!-- 4 Corner Mounting Holes with Copper Pads -->
    <circle cx="108" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="103" r="6" fill="#cbd5e1"/>
    
    <circle cx="532" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="103" r="6" fill="#cbd5e1"/>

    <circle cx="108" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="387" r="6" fill="#cbd5e1"/>

    <circle cx="532" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="387" r="6" fill="#cbd5e1"/>

    <!-- Inner Board Hardware Layout -->
    
      <!-- Main Microcontroller / Integrated Circuit Package -->
      <rect x="220" y="160" width="200" height="150" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" filter="url(#shadow)"/>
      <circle cx="238" cy="178" r="4" fill="#94a3b8"/>
      <text x="320" y="225" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">12-0-12V</text>
      <text x="320" y="250" fill="#00f2fe" font-family="monospace" font-size="11" text-anchor="middle">12-0-12V 1 Amp Step-Do...</text>
      <text x="320" y="275" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">GENUINE SEMICONDUCTOR</text>

      <!-- Surrounding SMD Resistors, Capacitors & Traces -->
      <rect x="180" y="170" width="20" height="10" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="180" y="200" width="20" height="10" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="440" y="170" width="20" height="10" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="440" y="200" width="20" height="10" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Status Indicator LEDs -->
      <circle cx="190" cy="270" r="4.5" fill="#10b981"/>
      <circle cx="190" cy="290" r="4.5" fill="#ef4444"/>
      <text x="202" y="274" fill="#10b981" font-family="monospace" font-size="8">PWR</text>
      <text x="202" y="294" fill="#ef4444" font-family="monospace" font-size="8">DAT</text>

      <!-- Pin Header Strip at Bottom -->
      <g fill="#1e293b" stroke="#000000" stroke-width="1">
        
          <rect x="175" y="360" width="18" height="18" rx="3"/>
          <circle cx="184" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="200" y="360" width="18" height="18" rx="3"/>
          <circle cx="209" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="225" y="360" width="18" height="18" rx="3"/>
          <circle cx="234" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="250" y="360" width="18" height="18" rx="3"/>
          <circle cx="259" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="275" y="360" width="18" height="18" rx="3"/>
          <circle cx="284" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="300" y="360" width="18" height="18" rx="3"/>
          <circle cx="309" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="325" y="360" width="18" height="18" rx="3"/>
          <circle cx="334" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="350" y="360" width="18" height="18" rx="3"/>
          <circle cx="359" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="375" y="360" width="18" height="18" rx="3"/>
          <circle cx="384" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="400" y="360" width="18" height="18" rx="3"/>
          <circle cx="409" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="425" y="360" width="18" height="18" rx="3"/>
          <circle cx="434" cy="369" r="4" fill="url(#goldGrad)"/>
        
          <rect x="450" y="360" width="18" height="18" rx="3"/>
          <circle cx="459" cy="369" r="4" fill="url(#goldGrad)"/>
        
      </g>
    

    <!-- Brand Silkscreen -->
    <text x="540" y="340" fill="rgba(255,255,255,0.75)" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="end">12-0-12V 1A Copper Wound</text>
    <text x="540" y="358" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="end">CIRCUITKART GENUINE</text>
  </g>

  <!-- View Angle Tag in Bottom Right -->
  <rect x="420" y="450" width="200" height="34" rx="8" fill="#0f172a" stroke="rgba(0,0,0,0.12)"/>
  <text x="520" y="472" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">HERO FRONT VIEW</text>
</svg>