<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(15, 23, 42, 0.22)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lcdBacklight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="heatsinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbUno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878f"/>
      <stop offset="100%" stop-color="#00666d"/>
    </linearGradient>
    <linearGradient id="pcbEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbRpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="pcbSensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pcbRelay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  
  </defs>

  <!-- Clean Studio Backdrop (Pure White for Real Product Photography Aesthetic) -->
  <rect width="640" height="500" fill="#ffffff"/>

  <!-- Realistic Cast Soft Ground Shadow -->
  <ellipse cx="320" cy="445" rx="250" ry="26" fill="rgba(15, 23, 42, 0.09)"/>

  <!-- Main Physical Hardware Component -->
  <g transform="rotate(-5 320 260) skewX(-4) scale(0.95)" filter="url(#shadow)">
    <!-- Main PCB Base Board -->
    <rect x="80" y="75" width="480" height="340" rx="20" fill="url(#pcbUno)" stroke="#00666d" stroke-width="3"/>
    
    <!-- 4 Corner Mounting Holes with Copper Pads -->
    <circle cx="108" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="103" r="6" fill="#cbd5e1"/>
    
    <circle cx="532" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="103" r="6" fill="#cbd5e1"/>

    <circle cx="108" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="387" r="6" fill="#cbd5e1"/>

    <circle cx="532" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="387" r="6" fill="#cbd5e1"/>

    <!-- Inner Board Hardware Layout -->
    
      <!-- Dual Aluminum Transducer Cans -->
      <g filter="url(#shadow)">
        <!-- Transmitter 'T' Can -->
        <circle cx="230" cy="240" r="65" fill="url(#metalGrad)" stroke="#475569" stroke-width="3"/>
        <circle cx="230" cy="240" r="55" fill="#334155"/>
        <circle cx="230" cy="240" r="45" fill="#1e293b"/>
        <!-- Fine Metal Mesh Grid Pattern -->
        <g stroke="rgba(255,255,255,0.18)" stroke-width="1.5">
          <line x1="195" y1="240" x2="265" y2="240"/>
          <line x1="230" y1="205" x2="230" y2="275"/>
          <circle cx="230" cy="240" r="25" fill="none"/>
        </g>
        <rect x="210" y="222" width="40" height="36" rx="6" fill="rgba(15, 23, 42, 0.75)"/>
        <text x="230" y="248" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="bold" text-anchor="middle">T</text>
        <text x="230" y="325" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TRANSMITTER</text>

        <!-- Receiver 'R' Can -->
        <circle cx="410" cy="240" r="65" fill="url(#metalGrad)" stroke="#475569" stroke-width="3"/>
        <circle cx="410" cy="240" r="55" fill="#334155"/>
        <circle cx="410" cy="240" r="45" fill="#1e293b"/>
        <!-- Fine Metal Mesh Grid Pattern -->
        <g stroke="rgba(255,255,255,0.18)" stroke-width="1.5">
          <line x1="375" y1="240" x2="445" y2="240"/>
          <line x1="410" y1="205" x2="410" y2="275"/>
          <circle cx="410" cy="240" r="25" fill="none"/>
        </g>
        <rect x="390" y="222" width="40" height="36" rx="6" fill="rgba(15, 23, 42, 0.75)"/>
        <text x="410" y="248" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="bold" text-anchor="middle">R</text>
        <text x="410" y="325" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">RECEIVER</text>
      </g>

      <!-- Center Crystal Oscillator & SMD Logic -->
      <rect x="305" y="225" width="30" height="16" rx="8" fill="url(#metalGrad)" stroke="#475569" stroke-width="1"/>
      <rect x="295" y="165" width="50" height="30" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="320" y="184" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">LM324</text>

      <!-- 4-Pin Male Header along Bottom -->
      <g fill="#1e293b" stroke="#000000" stroke-width="1">
        
          <rect x="260" y="360" width="20" height="20" rx="3"/>
          <circle cx="270" cy="370" r="4" fill="url(#goldGrad)"/>
          <text x="270" y="396" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">VCC</text>
        
          <rect x="296" y="360" width="20" height="20" rx="3"/>
          <circle cx="306" cy="370" r="4" fill="url(#goldGrad)"/>
          <text x="306" y="396" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Trig</text>
        
          <rect x="332" y="360" width="20" height="20" rx="3"/>
          <circle cx="342" cy="370" r="4" fill="url(#goldGrad)"/>
          <text x="342" y="396" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Echo</text>
        
          <rect x="368" y="360" width="20" height="20" rx="3"/>
          <circle cx="378" cy="370" r="4" fill="url(#goldGrad)"/>
          <text x="378" y="396" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">GND</text>
        
      </g>

      <text x="320" y="135" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">HC-SR04 ULTRASONIC</text>
    

    <!-- Brand Silkscreen -->
    <text x="540" y="340" fill="rgba(255,255,255,0.75)" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="end">HC-SR04 Acrylic Mount Holder</text>
    <text x="540" y="358" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="end">CIRCUITKART GENUINE</text>
  </g>

  <!-- View Angle Tag in Bottom Right -->
  <rect x="420" y="450" width="200" height="34" rx="8" fill="#0f172a" stroke="rgba(0,0,0,0.12)"/>
  <text x="520" y="472" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">3D PERSPECTIVE VIEW</text>
</svg>