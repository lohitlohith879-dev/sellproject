<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <linearGradient id="bluePrintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(15, 23, 42, 0.22)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lcdBacklight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="heatsinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbUno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878f"/>
      <stop offset="100%" stop-color="#00666d"/>
    </linearGradient>
    <linearGradient id="pcbEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbRpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="pcbSensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pcbRelay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  
  </defs>

  <!-- Technical Blueprint Grid Background -->
  <rect width="900" height="640" fill="url(#bluePrintBg)"/>
  
  <g stroke="rgba(0, 242, 254, 0.07)" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="640"/><line x1="50" y1="0" x2="50" y2="640"/><line x1="100" y1="0" x2="100" y2="640"/><line x1="150" y1="0" x2="150" y2="640"/><line x1="200" y1="0" x2="200" y2="640"/><line x1="250" y1="0" x2="250" y2="640"/><line x1="300" y1="0" x2="300" y2="640"/><line x1="350" y1="0" x2="350" y2="640"/><line x1="400" y1="0" x2="400" y2="640"/><line x1="450" y1="0" x2="450" y2="640"/><line x1="500" y1="0" x2="500" y2="640"/><line x1="550" y1="0" x2="550" y2="640"/><line x1="600" y1="0" x2="600" y2="640"/><line x1="650" y1="0" x2="650" y2="640"/><line x1="700" y1="0" x2="700" y2="640"/><line x1="750" y1="0" x2="750" y2="640"/><line x1="800" y1="0" x2="800" y2="640"/><line x1="850" y1="0" x2="850" y2="640"/>
    <line x1="0" y1="0" x2="900" y2="0"/><line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/><line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/><line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="300" x2="900" y2="300"/><line x1="0" y1="350" x2="900" y2="350"/><line x1="0" y1="400" x2="900" y2="400"/><line x1="0" y1="450" x2="900" y2="450"/><line x1="0" y1="500" x2="900" y2="500"/><line x1="0" y1="550" x2="900" y2="550"/><line x1="0" y1="600" x2="900" y2="600"/>
  </g>

  <!-- Header Banner -->
  <rect x="25" y="20" width="850" height="70" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="45" y="46" fill="#00f2fe" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="bold" letter-spacing="1.5">CIRCUITKART HARDWARE LABS • TECHNICAL PINOUT SPECIFICATION</text>
  <text x="45" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold">DHT11 Temperature &amp; Relative Humidity Sensor</text>
  
  <rect x="710" y="32" width="145" height="26" rx="6" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)"/>
  <text x="782" y="49" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DHT11 (Single-Bus Digital)</text>
  <text x="782" y="72" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Sensors and Modules</text>

  <!-- Central Microcontroller / Module Body -->
  <g transform="translate(300, 140)">
    <rect width="300" height="340" rx="16" fill="#0d1527" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <rect x="12" y="12" width="276" height="316" rx="10" fill="#090d1a" stroke="rgba(255,255,255,0.06)"/>
    
    <!-- Central IC Core Package -->
    <rect x="75" y="80" width="150" height="150" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="90" cy="95" r="4" fill="#94a3b8"/>
    <text x="150" y="145" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" text-anchor="middle">DHT11</text>
    <text x="150" y="168" fill="#00f2fe" font-family="monospace" font-size="11" text-anchor="middle">HARDWARE CORE</text>
    <text x="150" y="195" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">ROHS COMPLIANT</text>

    <!-- Specs Summary Box inside Chip -->
    <rect x="25" y="250" width="250" height="65" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(0, 242, 254, 0.2)"/>
    <text x="35" y="270" fill="#94a3b8" font-family="monospace" font-size="10">VOLTAGE: <tspan fill="#ffffff" font-weight="bold">3.5V to 5.5V DC</tspan></text>
    <text x="35" y="288" fill="#94a3b8" font-family="monospace" font-size="10">CURRENT: <tspan fill="#ffffff" font-weight="bold">0.5mA to 2.5mA</tspan></text>
    <text x="35" y="304" fill="#94a3b8" font-family="monospace" font-size="10">INTERFACE: <tspan fill="#00f2fe" font-weight="bold">Custom 1-Wire Serial Protocol</tspan></text>

    <!-- Top Connection Header Silkscreen -->
    
      <rect x="35" y="20" width="14" height="14" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="42" cy="27" r="3" fill="#f59e0b"/>
    
      <rect x="65" y="20" width="14" height="14" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="72" cy="27" r="3" fill="#f59e0b"/>
    
      <rect x="95" y="20" width="14" height="14" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="102" cy="27" r="3" fill="#f59e0b"/>
    
      <rect x="125" y="20" width="14" height="14" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="132" cy="27" r="3" fill="#f59e0b"/>
    
      <rect x="155" y="20" width="14" height="14" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="162" cy="27" r="3" fill="#f59e0b"/>
    
      <rect x="185" y="20" width="14" height="14" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="192" cy="27" r="3" fill="#f59e0b"/>
    
      <rect x="215" y="20" width="14" height="14" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="222" cy="27" r="3" fill="#f59e0b"/>
    
      <rect x="245" y="20" width="14" height="14" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="252" cy="27" r="3" fill="#f59e0b"/>
    
  </g>

  <!-- Left Pins Callouts -->
  <g transform="translate(35, 150)">
    
        <g transform="translate(0, 20)">
          <path d="M 265 20 L 220 20" stroke="#ef4444" stroke-width="2.5"/>
          <circle cx="265" cy="20" r="4" fill="#ef4444"/>
          <rect x="10" y="0" width="205" height="40" rx="8" fill="#0d1527" stroke="#ef4444" stroke-width="1.5"/>
          <text x="24" y="20" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">VCC</text>
          <text x="24" y="34" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Digital I/O</text>
        </g>
      
        <g transform="translate(0, 88)">
          <path d="M 265 20 L 220 20" stroke="#00f2fe" stroke-width="2.5"/>
          <circle cx="265" cy="20" r="4" fill="#00f2fe"/>
          <rect x="10" y="0" width="205" height="40" rx="8" fill="#0d1527" stroke="#00f2fe" stroke-width="1.5"/>
          <text x="24" y="20" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">DATA</text>
          <text x="24" y="34" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Digital I/O</text>
        </g>
      
  </g>

  <!-- Right Pins Callouts -->
  <g transform="translate(600, 150)">
    
        <g transform="translate(0, 20)">
          <path d="M 0 20 L 45 20" stroke="#f59e0b" stroke-width="2.5"/>
          <circle cx="0" cy="20" r="4" fill="#f59e0b"/>
          <rect x="50" y="0" width="215" height="40" rx="8" fill="#0d1527" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="64" y="20" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">GND</text>
          <text x="64" y="34" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Communication / Control</text>
        </g>
      
  </g>

  <!-- Bottom Wiring Standard Color Legend -->
  <g transform="translate(25, 520)">
    <rect width="850" height="95" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255,255,255,0.12)"/>
    <text x="25" y="26" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5">STANDARD BREADBOARD &amp; SENSOR WIRING CONVENTIONS:</text>
    
    <g transform="translate(25, 42)">
      <circle cx="10" cy="12" r="6" fill="#ef4444"/>
      <text x="24" y="16" fill="#f8fafc" font-family="monospace" font-size="11"><tspan font-weight="bold" fill="#ef4444">RED</tspan>: VCC (+5V / +3.3V)</text>

      <circle cx="190" cy="12" r="6" fill="#64748b"/>
      <text x="204" y="16" fill="#f8fafc" font-family="monospace" font-size="11"><tspan font-weight="bold" fill="#94a3b8">BLACK</tspan>: GND Ground (0V)</text>

      <circle cx="370" cy="12" r="6" fill="#00f2fe"/>
      <text x="384" y="16" fill="#f8fafc" font-family="monospace" font-size="11"><tspan font-weight="bold" fill="#00f2fe">CYAN</tspan>: I2C SDA / UART TX</text>

      <circle cx="560" cy="12" r="6" fill="#10b981"/>
      <text x="574" y="16" fill="#f8fafc" font-family="monospace" font-size="11"><tspan font-weight="bold" fill="#10b981">GREEN</tspan>: I2C SCL / UART RX</text>

      <circle cx="10" cy="38" r="6" fill="#8b5cf6"/>
      <text x="24" y="42" fill="#f8fafc" font-family="monospace" font-size="11"><tspan font-weight="bold" fill="#8b5cf6">PURPLE</tspan>: SPI (MOSI/MISO/SCK)</text>

      <circle cx="190" cy="38" r="6" fill="#f59e0b"/>
      <text x="204" y="42" fill="#f8fafc" font-family="monospace" font-size="11"><tspan font-weight="bold" fill="#f59e0b">ORANGE</tspan>: Analog / PWM</text>

      <circle cx="370" cy="38" r="6" fill="#ec4899"/>
      <text x="384" y="42" fill="#f8fafc" font-family="monospace" font-size="11"><tspan font-weight="bold" fill="#ec4899">PINK</tspan>: Interrupt / Reset</text>

      <circle cx="560" cy="38" r="6" fill="#eab308"/>
      <text x="574" y="42" fill="#f8fafc" font-family="monospace" font-size="11"><tspan font-weight="bold" fill="#eab308">YELLOW</tspan>: GPIO Signal</text>
    </g>
  </g>
</svg>