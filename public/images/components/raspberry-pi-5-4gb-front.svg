<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(15, 23, 42, 0.22)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lcdBacklight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="heatsinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbUno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878f"/>
      <stop offset="100%" stop-color="#00666d"/>
    </linearGradient>
    <linearGradient id="pcbEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcbRpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="pcbSensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pcbRelay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  
  </defs>

  <!-- Clean Studio Backdrop (Pure White for Real Product Photography Aesthetic) -->
  <rect width="640" height="500" fill="#ffffff"/>

  <!-- Realistic Cast Soft Ground Shadow -->
  <ellipse cx="320" cy="445" rx="250" ry="26" fill="rgba(15, 23, 42, 0.09)"/>

  <!-- Main Physical Hardware Component -->
  <g  filter="url(#shadow)">
    <!-- Main PCB Base Board -->
    <rect x="80" y="75" width="480" height="340" rx="20" fill="url(#pcbRpi)" stroke="#14532d" stroke-width="3"/>
    
    <!-- 4 Corner Mounting Holes with Copper Pads -->
    <circle cx="108" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="103" r="6" fill="#cbd5e1"/>
    
    <circle cx="532" cy="103" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="103" r="6" fill="#cbd5e1"/>

    <circle cx="108" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="108" cy="387" r="6" fill="#cbd5e1"/>

    <circle cx="532" cy="387" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="532" cy="387" r="6" fill="#cbd5e1"/>

    <!-- Inner Board Hardware Layout -->
    
      <!-- Broadcom SoC with Metallic Heat-Spreader in Center -->
      <rect x="230" y="190" width="110" height="110" rx="8" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
      <circle cx="242" cy="202" r="3" fill="#cbd5e1"/>
      <text x="285" y="235" fill="#0f172a" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">BROADCOM</text>
      <text x="285" y="255" fill="#334155" font-family="monospace" font-size="10" text-anchor="middle">BCM2711 64-BIT</text>
      <text x="285" y="275" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">CORTEX-A72</text>

      <!-- 40-Pin GPIO Header along Top Edge -->
      <g fill="#1e293b" stroke="#000000" stroke-width="1">
        
          <rect x="140" y="95" width="13" height="13" rx="2"/>
          <circle cx="146" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="140" y="112" width="13" height="13" rx="2"/>
          <circle cx="146" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="157" y="95" width="13" height="13" rx="2"/>
          <circle cx="163" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="157" y="112" width="13" height="13" rx="2"/>
          <circle cx="163" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="174" y="95" width="13" height="13" rx="2"/>
          <circle cx="180" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="174" y="112" width="13" height="13" rx="2"/>
          <circle cx="180" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="191" y="95" width="13" height="13" rx="2"/>
          <circle cx="197" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="191" y="112" width="13" height="13" rx="2"/>
          <circle cx="197" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="208" y="95" width="13" height="13" rx="2"/>
