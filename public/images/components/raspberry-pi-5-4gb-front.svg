          <rect x="208" y="112" width="13" height="13" rx="2"/>
          <circle cx="214" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="225" y="95" width="13" height="13" rx="2"/>
          <circle cx="231" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="225" y="112" width="13" height="13" rx="2"/>
          <circle cx="231" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="242" y="95" width="13" height="13" rx="2"/>
          <circle cx="248" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="242" y="112" width="13" height="13" rx="2"/>
          <circle cx="248" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="259" y="95" width="13" height="13" rx="2"/>
          <circle cx="265" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="259" y="112" width="13" height="13" rx="2"/>
          <circle cx="265" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="276" y="95" width="13" height="13" rx="2"/>
          <circle cx="282" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="276" y="112" width="13" height="13" rx="2"/>
          <circle cx="282" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="293" y="95" width="13" height="13" rx="2"/>
          <circle cx="299" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="293" y="112" width="13" height="13" rx="2"/>
          <circle cx="299" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="310" y="95" width="13" height="13" rx="2"/>
          <circle cx="316" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="310" y="112" width="13" height="13" rx="2"/>
          <circle cx="316" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="327" y="95" width="13" height="13" rx="2"/>
          <circle cx="333" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="327" y="112" width="13" height="13" rx="2"/>
          <circle cx="333" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="344" y="95" width="13" height="13" rx="2"/>
          <circle cx="350" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="344" y="112" width="13" height="13" rx="2"/>
          <circle cx="350" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="361" y="95" width="13" height="13" rx="2"/>
          <circle cx="367" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="361" y="112" width="13" height="13" rx="2"/>
          <circle cx="367" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="378" y="95" width="13" height="13" rx="2"/>
          <circle cx="384" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="378" y="112" width="13" height="13" rx="2"/>
          <circle cx="384" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
