          <rect x="412" y="112" width="13" height="13" rx="2"/>
          <circle cx="418" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="429" y="95" width="13" height="13" rx="2"/>
          <circle cx="435" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="429" y="112" width="13" height="13" rx="2"/>
          <circle cx="435" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="446" y="95" width="13" height="13" rx="2"/>
          <circle cx="452" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="446" y="112" width="13" height="13" rx="2"/>
          <circle cx="452" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
          <rect x="463" y="95" width="13" height="13" rx="2"/>
          <circle cx="469" cy="101" r="2.5" fill="url(#goldGrad)"/>
          <rect x="463" y="112" width="13" height="13" rx="2"/>
          <circle cx="469" cy="118" r="2.5" fill="url(#goldGrad)"/>
        
      </g>
      <text x="310" y="90" fill="rgba(255,255,255,0.85)" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">40-PIN COLOR EXTENDED GPIO</text>

      <!-- Dual Blue USB 3.0 Stack on Right -->
      <rect x="475" y="140" width="55" height="65" rx="5" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
      <rect x="480" y="148" width="45" height="20" rx="2" fill="#0284c7"/>
      <rect x="480" y="175" width="45" height="20" rx="2" fill="#0284c7"/>

      <!-- Dual Black USB 2.0 Stack on Right -->
      <rect x="475" y="225" width="55" height="65" rx="5" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
      <rect x="480" y="233" width="45" height="20" rx="2" fill="#1e293b"/>
      <rect x="480" y="260" width="45" height="20" rx="2" fill="#1e293b"/>

      <!-- Gigabit Ethernet RJ45 Jack on Right -->
      <rect x="475" y="310" width="60" height="75" rx="5" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
      <rect x="480" y="325" width="45" height="40" rx="3" fill="#0f172a"/>
      <circle cx="525" cy="320" r="3" fill="#10b981"/>
      <circle cx="525" cy="375" r="3" fill="#f59e0b"/>

      <!-- Dual Micro-HDMI Ports on Bottom -->
      <rect x="220" y="380" width="40" height="25" rx="3" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5"/>
      <rect x="280" y="380" width="40" height="25" rx="3" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5"/>
      <text x="240" y="375" fill="#ffffff" font-family="monospace" font-size="7" text-anchor="middle">HDMI 0</text>
      <text x="300" y="375" fill="#ffffff" font-family="monospace" font-size="7" text-anchor="middle">HDMI 1</text>

      <!-- USB-C Power Jack on Bottom Left -->
      <rect x="140" y="380" width="50" height="25" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5"/>
      <rect x="150" y="388" width="30" height="10" rx="4" fill="#0f172a"/>
      <text x="165" y="375" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">PWR IN</text>

      <!-- Raspberry Pi Fruit Silkscreen -->
      <g transform="translate(370, 200)">
        <circle cx="20" cy="30" r="14" fill="#dc2626"/>
        <circle cx="38" cy="30" r="14" fill="#dc2626"/>
        <circle cx="15" cy="46" r="12" fill="#dc2626"/>
        <circle cx="43" cy="46" r="12" fill="#dc2626"/>
        <circle cx="29" cy="55" r="13" fill="#dc2626"/>
        <!-- Green Leaves -->
        <path d="M 29 18 C 20 8, 15 15, 29 18 Z" fill="#16a34a"/>
        <path d="M 29 18 C 38 8, 43 15, 29 18 Z" fill="#16a34a"/>
        <text x="29" y="85" fill="#ffffff" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pi 4 B</text>
      </g>
    

    <!-- Brand Silkscreen -->
    <text x="540" y="340" fill="rgba(255,255,255,0.75)" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="end">SC1111 (BCM2712 Quad Cortex-A76)</text>
    <text x="540" y="358" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="end">CIRCUITKART GENUINE</text>
  </g>

  <!-- View Angle Tag in Bottom Right -->
  <rect x="420" y="450" width="200" height="34" rx="8" fill="#0f172a" stroke="rgba(0,0,0,0.12)"/>
  <text x="520" y="472" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">HERO FRONT VIEW</text>
</svg>